{% extends 'base.html' %}
{% block title %}{{ title }} | FamilyCare{% endblock %}
{% block content %}<section class="form-card wide-form"><p class="eyebrow">Family profile</p><h1>{{ title }}</h1><p class="form-subtitle">Keep your family member's information up to date.</p><form method="post" enctype="multipart/form-data" class="form-layout">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button type="submit">Save</button> <a class="secondary-action" href="{% url 'records:home' %}">Cancel</a></div></form></section>{% endblock %}
