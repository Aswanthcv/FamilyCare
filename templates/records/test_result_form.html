{% extends 'base.html' %}
{% block title %}{{ title }} | FamilyCare{% endblock %}
{% block content %}<section class="form-card wide-form"><p class="eyebrow">Test results</p><h1>{{ title }} for {{ member.full_name }}</h1><p class="form-subtitle">Add the test details and attach the report if available.</p><form method="post" enctype="multipart/form-data" class="form-layout">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button type="submit">Save</button> <a class="secondary-action" href="{% url 'records:member_detail' member.id %}">Cancel</a></div></form></section>{% endblock %}
