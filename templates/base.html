{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FamilyCare{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'records:home' %}">FamilyCare</a>
        <nav>
            {% if user.is_authenticated %}
                <span class="nav-user">{{ user.username }}</span>
                <a href="{% url 'records:logout' %}">Log out</a>
            {% else %}
                <a href="{% url 'records:login' %}">Log in</a>
                <a href="{% url 'records:register' %}">Register</a>
            {% endif %}
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
