{% extends 'base.html' %}
{% block title %}Register | FamilyCare{% endblock %}
{% block content %}
<section class="form-card">
    <h1>Create your FamilyCare account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="{% url 'records:login' %}">Log in</a>.</p>
</section>
{% endblock %}
