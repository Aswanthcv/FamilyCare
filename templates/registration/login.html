{% extends 'base.html' %}
{% block title %}Log in | FamilyCare{% endblock %}
{% block content %}
<section class="form-card">
    <h1>Log in to FamilyCare</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" class="form-layout compact-form">
        {% csrf_token %}
        <p><label for="username">Family Name</label><input type="text" name="username" id="username" required></p>
        <p><label for="password">Password</label><input type="password" name="password" id="password" required></p>
        <div class="form-actions"><button type="submit">Log in</button></div>
    </form>
    <p>Need an account? <a href="{% url 'records:register' %}">Register</a>.</p>
</section>
{% endblock %}
